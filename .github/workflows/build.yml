on:
  push:
    branches: [main]
    tags:
      - '*'
  pull_request:
    branches: [main]
name: Plugin-CI

# Trusted Publishing (OIDC) requires an id-token so npm can verify this
# workflow's identity instead of a long-lived NPM_TOKEN secret.
permissions:
  contents: read
  id-token: write

jobs:
  build_publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm CLI >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Set env
        if: startsWith( github.ref, 'refs/tags/')
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Set npm version
        if: startsWith( github.ref, 'refs/tags/')
        run: npm version $RELEASE_VERSION --allow-same-version --no-git-tag-version

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build NPM Module
        run: npm run build

      # No NPM_TOKEN: npm detects the OIDC environment and authenticates via
      # the trusted publisher configured on npmjs.com for this package.
      - name: Publish to npm
        if: startsWith( github.ref, 'refs/tags/')
        run: npm publish --access public
